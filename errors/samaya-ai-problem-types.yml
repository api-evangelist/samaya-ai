format: none
format_note: >-
  Not RFC 9457. No operation in the published OpenAPI declares application/problem+json, and no
  observed error body carries type/title/status/detail members.
spec_gap: >-
  All six published operations declare ONLY a 200 response. There is no 400, 401, 403, 404, 409, 422,
  429 or 5xx anywhere in the contract, so an agent generated from this spec has no idea what failure
  looks like — including for the two bulk write operations, which the descriptions say "return
  partial success". This is the single largest contract-quality gap on the REST surface.
envelope:
  rest: unknown
  rest_note: >-
    Undeclared and unobservable anonymously (every operation requires a WorkOS bearer token).
  partial_success:
    applies_to:
    - samaya_api_rest_views_teams_add_team_members
    - samaya_api_rest_views_teams_remove_team_members
    shape: >-
      Both bulk operations return HTTP 200 carrying a per-item error array rather than failing the
      request. Errors are therefore in-band, not in the status code.
    schemas:
    - BulkAddResponse -> added[] + errors[]
    - BulkRemoveResponse -> removed[] + errors[]
    - MemberError -> { email, detail }
