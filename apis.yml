- name: Samaya GraphQL API
  description: >-
    Application GraphQL endpoint at https://api.samaya.ai/graphql/ serving the Samaya web app at
    app.samaya.ai. The API host root 302s to /graphql/, and an anonymous introspection POST returns
    HTTP 401 "Unauthorized", so the schema is authentication-gated and was not captured. Recorded as a
    discovered-but-gated surface, never fabricated.
  humanURL: https://app.samaya.ai/
  baseURL: https://api.samaya.ai/graphql/
