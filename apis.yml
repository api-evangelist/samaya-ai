apis:
- name: Samaya Public API
  description: >-
    REST API published at https://api.samaya.ai/v1/openapi.json as "Samaya Public API" (OpenAPI 3.0.2).
    Six operations covering organization, team and team-membership administration plus user listing —
    list orgs, list teams, list/add/remove team members in bulk by email, and list org users with an
    optional email filter. Cursor-paginated. Authenticated with a WorkOS machine-to-machine bearer token
    (securityScheme WorkOsM2MAuth), which makes this the tenant-provisioning surface for enterprise
    Samaya deployments rather than the research/agent surface.
  humanURL: https://api.samaya.ai/v1/openapi.json
  baseURL: https://api.samaya.ai
  tags:
