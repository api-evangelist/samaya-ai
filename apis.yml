- name: Samaya MCP Server
  description: >-
    Hosted remote MCP server at https://mcp.samaya.ai/mcp that connects ChatGPT, Claude and other AI
    applications to Samaya's expert financial research capabilities. Live and reachable: an anonymous
    tools/list POST returns HTTP 401 with an RFC 9728 WWW-Authenticate challenge pointing at
    /.well-known/oauth-protected-resource/mcp, and the authorization server at mcp.samaya.ai publishes
    RFC 8414 metadata with dynamic client registration and PKCE S256. Access is request-gated behind the
    "Explore MCP" form on samaya.ai; the tool list is therefore not anonymously enumerable.
  humanURL: https://samaya.ai/
  baseURL: https://mcp.samaya.ai/mcp
  tags:
  - MCP
  - agent-native
  - Investment Research
  - AI Agents
  tags_raw:
