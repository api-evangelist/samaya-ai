aid: samaya-ai
name: Samaya AI
description: >-
  Samaya AI builds domain-trained "Expert AI Agents" for financial services — investment research,
  client advisory and deal diligence — deployed across 10,000+ seats at bulge-bracket banks including
  Morgan Stanley. The platform ingests filings, broker research and a firm's own proprietary documents,
  reconciles figures across them, and cites every number it returns. Founded in 2022 by Maithra Raghu
  (formerly Google Brain) and Fabio Petroni, it raised a $43.5M Series A led by NEA with NVentures
  (NVIDIA), Databricks Ventures, Eric Schmidt and Yann LeCun participating. Its machine surface is
  agent-first: a live OAuth-protected remote MCP server at mcp.samaya.ai that connects ChatGPT, Claude
  and other AI applications to Samaya's research capabilities, plus a small "Samaya Public API" for
  org/team/user provisioning and an authenticated GraphQL endpoint behind the app.
