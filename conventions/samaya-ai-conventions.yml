    reversal_path: DELETE /v1/orgs/{org_id}/teams/{team_id}/members
    reversal_kind: inverse-operation
    window: unstated
    window_source: null
    note: >-
      Add and remove are exact inverses addressed by the same email list, so an accidental bulk add
      is undoable. Partial success on either side means the reversal set must be read from the
      response (added[] / removed[]), not assumed from the request.
  - write: samaya_api_rest_views_teams_remove_team_members
    write_path: DELETE /v1/orgs/{org_id}/teams/{team_id}/members
    reversal: samaya_api_rest_views_teams_add_team_members
    reversal_path: POST /v1/orgs/{org_id}/teams/{team_id}/members
    reversal_kind: inverse-operation
    window: unstated
    window_source: null
    note: >-
      Re-adding restores membership, but whether it restores the member's prior role, saved work or
      document access is NOT stated. MemberEntry.role defaults to "MEMBER", so a naive reversal can
      silently demote a previously elevated member. Read the role from the original listing before
